<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Competition Timer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232b5bd7'/><path d='M8 11l4 10 4-7 4 7 4-10' stroke='white' stroke-width='2.5' fill='none' stroke-linejoin='round'/></svg>">
  <style>
    :root {
      --bg: #f4f5f8; --surface: #fff; --border: #dde1ea; --text: #1d2433; --muted: #5d6578;
      --ok: #1f8a4c; --warn: #b4610a; --warn-bg: #fdf0e0; --err: #c62f26; --info: #2b5bd7; --info-bg: #e6edfc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1117; --surface: #1b1f29; --border: #2c3242; --text: #eef1f7; --muted: #a0a8ba;
        --ok: #4ade80; --warn: #fbbf24; --warn-bg: #3a2a0e; --err: #f87171; --info: #8fb0ff; --info-bg: #1b2747;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px clamp(16px, 4vw, 48px);
      border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: clamp(18px, 2.2vw, 28px); }
    .logo { width: 1.6em; height: 1.6em; border-radius: 8px; background: #2b5bd7; color: #fff; display: grid; place-items: center; font-size: .8em; }
    .clock { color: var(--muted); font-variant-numeric: tabular-nums; font-size: clamp(16px, 2vw, 26px); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 2vh, 28px);
      padding: clamp(16px, 3vw, 40px) clamp(16px, 4vw, 48px); text-align: center; }
    #title { font-size: clamp(24px, 4vw, 56px); font-weight: 700; margin: 0; }
    #big { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -0.02em; line-height: 1;
      font-size: clamp(64px, 19vw, 300px); }
    #big.warn { color: var(--warn); } #big.over { color: var(--err); }
    #status { font-size: clamp(18px, 2.4vw, 32px); font-weight: 600; padding: 6px 22px; border-radius: 999px; background: var(--info-bg); color: var(--info); }
    #status.running { background: none; color: var(--ok); }
    #status.over { background: none; color: var(--err); }
    #status.paused { background: var(--warn-bg); color: var(--warn); }
    #extra-box { width: min(100%, 1100px); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: clamp(14px, 2vw, 24px); }
    #extra-box[hidden] { display: none; }
    #extra-box h2 { margin: 0 0 12px; font-size: clamp(18px, 2vw, 28px); text-align: left; }
    #extra { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    #extra li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 14px; border-radius: 10px;
      background: var(--warn-bg); font-size: clamp(18px, 2vw, 26px); font-weight: 600; text-align: left; }
    #extra li span { font-variant-numeric: tabular-nums; white-space: nowrap; }
    #extra li small { display: block; font-size: .6em; font-weight: 500; color: var(--muted); }
    #extra li.over span { color: var(--err); }
    footer { padding: 0 clamp(16px, 4vw, 48px) 20px; color: var(--muted); font-size: 14px; }
    .stale { color: var(--err); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="logo">W</span> Competition timer</div>
    <div class="clock" id="clock"></div>
  </header>
  <main>
    <h1 id="title">&nbsp;</h1>
    <div id="big">--:--:--</div>
    <div id="status">Loading…</div>
    <section id="extra-box" hidden>
      <h2>Extra time</h2>
      <ul id="extra"></ul>
    </section>
  </main>
  <footer id="foot"></footer>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (sec) => {
      sec = Math.max(0, Math.floor(sec));
      return [Math.floor(sec / 3600), Math.floor((sec % 3600) / 60), sec % 60].map((n) => String(n).padStart(2, '0')).join(':');
    };
    let data = null;
    let offset = 0; // server clock minus this device's clock
    let lastOk = 0;

    // Seconds left on the shared timer, using the server's clock
    function left() {
      if (!data) return 0;
      if (data.status === 'running') return (Date.parse(data.endsAt) - (Date.now() + offset)) / 1000;
      return data.remainingSec;
    }

    function draw() {
      document.getElementById('clock').textContent = new Date(Date.now() + offset).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      if (!data) return;
      const l = left();
      const big = document.getElementById('big');
      const st = document.getElementById('status');
      big.textContent = fmt(Math.ceil(l));
      const over = data.status !== 'idle' && l <= 0;
      big.className = over ? 'over' : l <= 600 && data.status !== 'idle' ? 'warn' : '';
      if (data.status === 'idle') { st.textContent = 'Not started'; st.className = ''; }
      else if (over) { st.textContent = 'Time is up'; st.className = 'over'; }
      else if (data.status === 'paused') { st.textContent = 'Paused'; st.className = 'paused'; }
      else { st.textContent = 'Running'; st.className = 'running'; }

      const box = document.getElementById('extra-box');
      box.hidden = !data.extra.length;
      document.getElementById('extra').innerHTML = data.extra.map((c) => {
        const cl = l + c.extraSeconds;
        const done = data.status !== 'idle' && cl <= 0;
        return `<li class="${done ? 'over' : ''}"><div>${esc(c.name)}<small>+${Math.round(c.extraSeconds / 60)} min extra</small></div>
          <span>${done ? 'Time is up' : fmt(Math.ceil(cl))}</span></li>`;
      }).join('');
    }

    async function load() {
      try {
        const t0 = Date.now();
        const r = await fetch('/api/public/timer', { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        const t1 = Date.now();
        offset = Date.parse(d.serverNow) - (t0 + t1) / 2; // correct for this device's clock
        data = d;
        document.getElementById('title').textContent = d.title;
        lastOk = Date.now();
      } catch { /* keep counting with the last known state */ }
      document.getElementById('foot').innerHTML = lastOk && Date.now() - lastOk < 20000
        ? 'Synchronised with the platform clock.'
        : '<span class="stale">Cannot reach the platform – still counting with the last known state.</span>';
      draw();
    }

    load(); setInterval(load, 3000); setInterval(draw, 250);
  </script>
</body>
</html>
