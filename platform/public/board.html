<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trainer Locations</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232b5bd7'/><path d='M8 11l4 10 4-7 4 7 4-10' stroke='white' stroke-width='2.5' fill='none' stroke-linejoin='round'/></svg>">
  <style>
    :root {
      --bg: #f4f5f8; --surface: #fff; --border: #dde1ea; --text: #1d2433; --muted: #5d6578;
      --floor: #1f8a4c; --floor-bg: #e3f5ea; --marking: #b4610a; --marking-bg: #fdf0e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c; --surface: #1b1f29; --border: #2c3242; --text: #e6e9f0; --muted: #a0a8ba;
        --floor: #4ade80; --floor-bg: #133222; --marking: #fbbf24; --marking-bg: #3a2a0e;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: clamp(18px, 2.2vw, 28px); }
    .logo { width: 1.6em; height: 1.6em; border-radius: 8px; background: #2b5bd7; color: #fff; display: grid; place-items: center; font-size: .8em; }
    .clock { font-variant-numeric: tabular-nums; font-size: clamp(22px, 3vw, 40px); font-weight: 700; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2vw, 32px); padding: clamp(16px, 3vw, 40px) clamp(16px, 4vw, 48px); }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } section { min-height: 0; } }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: clamp(16px, 2vw, 28px); min-height: 40vh; }
    section h2 { margin: 0 0 16px; font-size: clamp(22px, 2.6vw, 38px); display: flex; align-items: center; gap: 12px; }
    section h2 .count { margin-left: auto; font-size: .7em; padding: 2px 14px; border-radius: 999px; }
    .floor h2 { color: var(--floor); } .floor .count { background: var(--floor-bg); }
    .marking h2 { color: var(--marking); } .marking .count { background: var(--marking-bg); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; border-radius: 10px; font-size: clamp(20px, 2.4vw, 34px); font-weight: 600; }
    .floor li { background: var(--floor-bg); } .marking li { background: var(--marking-bg); }
    li small { font-size: .5em; color: var(--muted); font-weight: 500; white-space: nowrap; }
    .floor li.empty, .marking li.empty { background: none; color: var(--muted); font-size: clamp(16px, 1.6vw, 22px); font-weight: 500; padding: 8px 4px; }
    .off { grid-column: 1 / -1; min-height: 0; }
    .off h2 { color: var(--muted); font-size: clamp(16px, 1.8vw, 24px); margin-bottom: 8px; }
    .off p { margin: 0; color: var(--muted); font-size: clamp(16px, 1.6vw, 22px); }
    footer { padding: 0 clamp(16px, 4vw, 48px) 24px; color: var(--muted); font-size: 14px; }
    .stale { color: #d0342c; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="logo">W</span> Trainer locations</div>
    <div class="clock" id="clock"></div>
  </header>
  <main>
    <section class="floor"><h2>On the floor <span class="count" id="n-floor">0</span></h2><ul id="floor"></ul></section>
    <section class="marking"><h2>In the marking room <span class="count" id="n-marking">0</span></h2><ul id="marking"></ul></section>
    <section class="off"><h2>Off duty</h2><p id="off">—</p></section>
  </main>
  <footer id="status">Loading…</footer>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const time = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let lastOk = 0;

    function list(id, people) {
      document.getElementById(`n-${id}`).textContent = people.length;
      document.getElementById(id).innerHTML = people.length
        ? people.map((t) => `<li>${esc(t.name)}${t.since ? `<small>since ${time(t.since)}</small>` : ''}</li>`).join('')
        : '<li class="empty">Nobody</li>';
    }

    async function load() {
      try {
        const r = await fetch('/api/public/board', { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        list('floor', d.trainers.filter((t) => t.location === 'floor'));
        list('marking', d.trainers.filter((t) => t.location === 'marking'));
        const off = d.trainers.filter((t) => !t.location).map((t) => esc(t.name));
        document.getElementById('off').innerHTML = off.length ? off.join(' · ') : 'Nobody';
        lastOk = Date.now();
      } catch { /* keep the last view; the footer shows it is stale */ }
      const age = Math.round((Date.now() - lastOk) / 1000);
      document.getElementById('status').innerHTML = lastOk && age < 30
        ? 'Updates automatically every 5 seconds.'
        : '<span class="stale">Cannot reach the platform – showing the last known locations.</span>';
    }

    function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
    tick(); setInterval(tick, 1000);
    load(); setInterval(load, 5000);
  </script>
</body>
</html>
